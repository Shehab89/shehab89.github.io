<style>
    :root {
        /* Professional Data Science Palette */
        --bg-deep: #030712;
        --glass-bg: rgba(17, 24, 39, 0.7);
        --accent-primary: #38bdf8; /* Sky Blue */
        --accent-secondary: #818cf8; /* Indigo */
        --text-main: #94a3b8;
        --text-bright: #f8fafc;
        --white: #ffffff;
    }

    body {
        background-color: var(--bg-deep);
        /* Applying site-bg.png here */
        background-image: 
            linear-gradient(rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.85)), 
            url('images/site-bg.png');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text-main);
        font-family: 'DM Sans', sans-serif;
    }

    /* ── ENHANCED TYPOGRAPHY ── */
    h1, h2, h3 { 
        font-family: 'Sora', sans-serif; 
        color: var(--text-bright) !important;
        letter-spacing: -0.03em;
    }

    /* ── GLASS CARDS ── */
    .box.style1, .impact-card {
        background: var(--glass-bg) !important;
        backdrop-filter: blur(12px); /* The "Glass" effect */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .box.style1:hover, .impact-card:hover {
        border-color: var(--accent-primary);
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 20px 40px rgba(56, 189, 248, 0.2);
    }

    /* ── LOGO BOX (Clean & Minimal) ── */
    .logo-box {
        background: var(--white);
        border-radius: 15px;
        height: 100px;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
    }

    /* ── MODERN BUTTONS ── */
    .btn-send {
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        color: #fff !important;
        font-family: 'Sora', sans-serif;
        font-weight: 700;
        border: none;
        border-radius: 12px;
        padding: 1.2rem 2.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(129, 140, 248, 0.4);
    }

    .btn-send:hover {
        opacity: 0.9;
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(129, 140, 248, 0.6);
    }

    /* ── IMPACT TAGS ── */
    .impact-tag {
        background: rgba(56, 189, 248, 0.15);
        color: var(--accent-primary);
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 4px 12px;
        border-radius: 50px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
    }

    /* ── NAVIGATION ── */
    #nav {
        background: rgba(3, 7, 18, 0.8);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
</style>
